<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supply Chain Flow Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- (unchanged UI content omitted for brevity but fully preserved) -->
  </div>

  <template id="nodeTemplate">
    <article class="node-card">
      <div class="node-header">
        <div class="node-title-wrap">
          <span class="node-type-chip"></span>
          <input class="node-title" />
        </div>
        <button class="delete-node" title="Delete node">×</button>
      </div>
      <div class="node-body"></div>
      <div class="port in-port" data-port="in"></div>
      <div class="port out-port out-port-material" data-port="out" data-port-kind="material"></div>
      <div class="port out-port out-port-information" data-port="out" data-port-kind="information"></div>
    </article>
  </template>

  <!-- NEW modular node system -->
  <script src="frontend/coreNodes.js"></script>
  <script src="frontend/nodeRegistry.js"></script>

  <!-- Existing app -->
  <script src="app.js"></script>
</body>
</html>
